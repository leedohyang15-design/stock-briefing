<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 단타 트레이딩 사무실</title>
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<style>
@font-face{font-family:'Galmuri11';src:url('/vendor/fonts/Galmuri11.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Galmuri11';src:url('/vendor/fonts/Galmuri11-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
/* 팔레트: Sweetie 16 계열 (픽셀 아트용) */
:root{--ink:#1a1c2c;--ink2:#262b44;--panel:#333c57;--panel2:#3e4a6b;--line:#566c86;--paper:#f4f4f4;--muted:#94b0c2;
--yellow:#ffcd75;--orange:#ef7d57;--red:#ff6b6b;--green:#a7f070;--green2:#38b764;--blue:#41a6f6;--cyan:#73eff7;--purple:#b13e53;
--wood:#8b5a3c;--wood2:#7a4e34;--wall:#2e3a59;--wall2:#29324e}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:var(--paper);font-family:'Galmuri11',system-ui,sans-serif;font-size:14px;line-height:1.5}
canvas.spr{image-rendering:pixelated;image-rendering:crisp-edges}
.wrap{max-width:1480px;margin:0 auto;padding:12px;display:flex;flex-direction:column;gap:12px}
/* 픽셀 패널 */
.px{background:var(--panel);border:4px solid var(--ink);box-shadow:inset -4px -4px 0 var(--ink2),inset 4px 4px 0 var(--panel2),0 0 0 4px var(--line);padding:14px;min-width:0}
.px h2{margin:0 0 10px;font-size:15px;font-weight:700;color:var(--yellow)}
.muted{color:var(--muted)}.small{font-size:12px}.up{color:var(--red)}.down{color:var(--blue)}
header{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.title{font-size:20px;font-weight:700;color:var(--yellow);text-shadow:2px 2px 0 var(--ink2)}
.pill{display:inline-block;padding:3px 10px;border:2px solid var(--ink);font-size:12px}
.tabs{display:flex;gap:6px}
.btn{font:inherit;cursor:pointer;border:3px solid var(--ink);background:var(--panel2);color:var(--paper);padding:6px 14px;min-height:40px;box-shadow:inset -3px -3px 0 var(--ink2)}
.btn.on{background:var(--yellow);color:var(--ink);font-weight:700;box-shadow:inset -3px -3px 0 #c8963e}
/* ── 사무실 장면 (1400x560 기준, 화면 폭에 맞춰 축소) ── */
#sceneWrap{position:relative;width:100%;overflow:hidden;border:4px solid var(--ink);box-shadow:0 0 0 4px var(--line)}
#scene{position:absolute;left:0;top:0;width:1400px;height:560px;transform-origin:0 0}
.wall{position:absolute;left:0;top:0;width:1400px;height:200px;background:repeating-linear-gradient(90deg,var(--wall) 0 32px,var(--wall2) 32px 64px)}
.base{position:absolute;left:0;top:192px;width:1400px;height:12px;background:#1f2640}
.floor{position:absolute;left:0;top:204px;width:1400px;height:356px;background:
 repeating-conic-gradient(var(--wood) 0 25%,var(--wood2) 0 50%) 0 0/48px 48px}
.zone{position:absolute;font-size:12px;color:var(--ink);background:var(--yellow);padding:1px 8px;border:2px solid var(--ink)}
.board{position:absolute;left:36px;top:18px;width:600px;height:166px;background:#e8ecef;border:6px solid #b8c1c8;box-shadow:0 0 0 3px var(--ink),6px 6px 0 rgba(0,0,0,.35);color:var(--ink);padding:10px 14px;overflow:hidden}
.board .lbl{font-size:11px;color:#57606a}
.board .now{font-size:16px;font-weight:700;line-height:1.35;max-height:44px;overflow:hidden}
.board .next{font-size:12px;margin-top:2px;max-height:36px;overflow:hidden}
.notes{display:flex;gap:6px;margin-top:8px}
.note{flex:1;font-size:11px;padding:4px 6px;background:#fff3b0;border:2px solid var(--ink);color:var(--ink);line-height:1.3}
.note.done{background:#c7f9cc}.note.cur{background:var(--orange);color:#fff;transform:rotate(-2deg)}
.win{position:absolute;left:668px;top:26px;width:170px;height:120px;background:linear-gradient(#73eff7,#41a6f6);border:6px solid #94b0c2;box-shadow:0 0 0 3px var(--ink)}
.win:before{content:"";position:absolute;left:76px;top:0;width:6px;height:100%;background:#94b0c2}
.win:after{content:"";position:absolute;left:0;top:52px;width:100%;height:6px;background:#94b0c2}
.clock{position:absolute;left:872px;top:40px;width:90px;height:90px;border-radius:50%;background:var(--paper);border:6px solid var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-size:17px}
.score{position:absolute;left:992px;top:22px;width:372px;height:150px;background:#0b0d17;border:6px solid #3e4a6b;box-shadow:0 0 0 3px var(--ink);padding:8px 12px;color:var(--green);display:grid;grid-template-columns:1fr 1fr;gap:2px 10px}
.score .k{font-size:11px;color:#5c7a5c}.score .v{font-size:22px;font-weight:700;letter-spacing:1px}
.table{position:absolute;left:66px;top:322px;width:384px;height:84px;background:#c08a5a;border:4px solid var(--ink);box-shadow:inset 0 -10px 0 #9d6b44,6px 6px 0 rgba(0,0,0,.3);z-index:5}
.paper{position:absolute;width:26px;height:18px;background:var(--paper);border:2px solid var(--ink)}
.desk{position:absolute;width:112px;height:46px;background:#c08a5a;border:4px solid var(--ink);box-shadow:inset 0 -8px 0 #9d6b44,4px 4px 0 rgba(0,0,0,.3);z-index:5}
.mon{position:absolute;left:72px;top:-30px;width:34px;height:28px;background:#0b0d17;border:3px solid var(--ink);box-shadow:inset 0 0 0 2px #3e4a6b}
.mon i{position:absolute;left:4px;right:4px;bottom:5px;height:3px;background:var(--green);box-shadow:0 -6px 0 var(--red),0 -12px 0 var(--green)}
.booth{position:absolute;left:930px;top:204px;width:8px;height:356px;background:#1f2640}
.shelf{position:absolute;left:1186px;top:330px;width:170px;height:150px;background:#6b4226;border:4px solid var(--ink);z-index:2;
 background-image:repeating-linear-gradient(#6b4226 0 40px,#4a2c18 40px 46px)}
.books{position:absolute;left:8px;right:8px;height:30px;background:repeating-linear-gradient(90deg,#b13e53 0 10px,#41a6f6 10px 18px,#ffcd75 18px 26px,#38b764 26px 34px)}
.plant{position:absolute;left:1300px;top:232px;width:44px;height:80px}
.plant:before{content:"";position:absolute;left:6px;top:0;width:32px;height:40px;background:var(--green2);border:3px solid var(--ink);border-radius:4px}
.plant:after{content:"";position:absolute;left:10px;top:40px;width:24px;height:30px;background:var(--orange);border:3px solid var(--ink)}
/* 에이전트 */
.ag{position:absolute;width:64px;height:80px;cursor:pointer;z-index:4}
.ag.front{z-index:6}
.ag.talk{z-index:30}
.ag canvas{width:64px;height:80px;animation:bob 1.6s steps(2) infinite}
.ag.act canvas{animation:bob .4s steps(2) infinite}
.ag.no canvas{filter:drop-shadow(0 0 4px var(--red))}
@keyframes bob{0%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.tag{position:absolute;left:50%;top:-22px;transform:translateX(-50%);white-space:nowrap;font-size:11px;background:var(--ink);color:var(--paper);padding:0 5px;border:2px solid var(--line);z-index:7}
.badge{position:absolute;left:100%;top:-22px;margin-left:-10px;font-size:10px;font-weight:700;padding:0 4px;border:2px solid var(--ink);z-index:8}
.b-pass{background:var(--green);color:var(--ink)}.b-reject{background:var(--red);color:#fff}.b-wait{background:var(--yellow);color:var(--ink)}.b-info{background:var(--paper);color:var(--ink)}
.bubble{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);width:max-content;max-width:240px;background:var(--paper);color:var(--ink);font-size:12px;line-height:1.35;padding:6px 8px;border:3px solid var(--ink);box-shadow:3px 3px 0 rgba(0,0,0,.4);z-index:20;display:none}
.bubble:after{content:"";position:absolute;left:50%;bottom:-11px;margin-left:-6px;border:6px solid transparent;border-top-color:var(--ink)}
.ag.talk .bubble{display:block}
.bubble.r{border-color:var(--red)}.bubble.p{border-color:var(--green2)}
/* 아래 패널 */
.grid2{display:grid;grid-template-columns:380px minmax(0,1fr);gap:16px}
.grid3{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.stock{display:block;width:100%;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--ink2);border:3px solid var(--ink);padding:8px 10px;margin-bottom:8px;box-shadow:inset -3px -3px 0 var(--ink)}
.stock.sel{background:#29366f;border-color:var(--yellow)}
.row{display:flex;justify-content:space-between;gap:8px;align-items:center}
.chip{font-size:11px;padding:0 6px;border:2px solid var(--ink)}
.c-watch{background:var(--panel2)}.c-pending{background:var(--yellow);color:var(--ink)}.c-hold{background:var(--red);color:#fff}.c-blocked{background:#555;color:#ccc}.c-done{background:var(--green);color:var(--ink)}
.orb{position:relative;height:8px;background:var(--ink);margin-top:6px;border:2px solid var(--ink)}
.orb .rng{position:absolute;top:0;height:4px;background:var(--blue)}.orb .px{position:absolute;top:-4px;width:4px;height:12px;background:var(--yellow)}
#chart{height:400px;border:4px solid var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:11px;color:var(--muted);margin-top:6px}
.flow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.node{display:flex;flex-direction:column;align-items:center;width:70px;text-align:center}
.node .c{width:38px;height:38px;display:flex;align-items:center;justify-content:center;font-weight:700;border:3px solid var(--ink);background:var(--ink2);color:var(--muted)}
.node .n{font-size:11px;color:var(--muted);margin-top:3px;line-height:1.2}
.node.pass .c{background:var(--green);color:var(--ink)}.node.reject .c{background:var(--red);color:#fff}.node.wait .c{background:var(--yellow);color:var(--ink)}
.arr{color:var(--line)}
.feed{display:flex;flex-direction:column;gap:8px;max-height:460px;overflow:auto;padding-right:4px}
.msg{display:flex;gap:8px;align-items:flex-start}
.msg canvas{width:32px;height:40px;flex:none}
.say{background:var(--ink2);border:3px solid var(--ink);padding:5px 9px;font-size:13px}
.say .who{font-size:11px;color:var(--yellow)}
.say.reject{border-color:var(--red)}.say.pass{border-color:var(--green2)}
.sep{font-size:11px;color:var(--muted);text-align:center;border-top:2px dashed var(--line);padding-top:6px}
.seg{display:flex;gap:6px}
.ev{display:flex;gap:10px;padding:5px 0;border-bottom:2px dotted var(--ink2);font-size:13px}.ev .t{color:var(--muted);width:64px;flex:none}
.tm{display:flex;height:18px;border:3px solid var(--ink);font-size:10px;margin:6px 0}.tm div{display:flex;align-items:center;justify-content:center;color:var(--ink);overflow:hidden;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px;border-bottom:2px dotted var(--ink2);text-align:left}th{color:var(--yellow);font-weight:400}
.empty{color:var(--muted);font-size:13px;padding:6px 0}
@media (max-width:1100px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <span class="title">AI 단타 트레이딩 사무실</span>
    <span class="pill" id="mode">불러오는 중</span>
    <span class="small muted" id="sub"></span>
  </div>
  <nav class="tabs" aria-label="화면"><button class="btn on" id="tToday">오늘</button><button class="btn" id="tWeek">주간 복기</button></nav>
</header>

<div id="today" style="display:flex;flex-direction:column;gap:16px">
  <div id="sceneWrap" aria-label="에이전트 사무실">
    <div id="scene">
      <div class="wall"></div><div class="base"></div><div class="floor"></div>
      <div class="board"><div class="lbl">지금 하는 일</div><div class="now" id="bNow">불러오는 중…</div>
        <div class="next" id="bNext"></div><div class="notes" id="steps"></div></div>
      <div class="win"></div><div class="clock" id="clock">--:--</div>
      <div class="score" id="score"></div>
      <div class="zone" style="left:66px;top:210px">회의실 · 장전 분석팀</div>
      <div class="zone" style="left:500px;top:210px">트레이딩 데스크 · 장중 실행팀</div>
      <div class="zone" style="left:960px;top:210px">리스크 · 주문 · 복기</div>
      <div class="table"><span class="paper" style="left:30px;top:20px"></span><span class="paper" style="left:120px;top:36px"></span><span class="paper" style="left:230px;top:18px"></span><span class="paper" style="left:320px;top:34px"></span></div>
      <div class="booth"></div>
      <div class="shelf"><div class="books" style="top:6px"></div><div class="books" style="top:52px"></div><div class="books" style="top:98px"></div></div>
      <div class="plant"></div>
      <div id="desks"></div>
      <div id="agents"></div>
    </div>
  </div>

  <div class="grid2">
    <section class="px" aria-label="관심종목"><h2>오늘 지켜보는 종목 <span class="small muted" id="ipCount"></span></h2>
      <div class="small muted" style="margin-bottom:8px">파란 막대 = 시가범위, 노란 막대 = 현재가. 오른쪽 끝을 넘으면 돌파!</div>
      <div id="stocks"></div><h2 style="margin-top:14px">오늘의 증시</h2><div id="market"></div></section>
    <section class="px" aria-label="차트"><div class="row"><h2 id="cTitle">모니터</h2><span class="small muted" id="cInfo"></span></div>
      <div id="chart"></div>
      <div class="legend"><span>-- 시가범위</span><span style="color:var(--yellow)">-- 정적 VI · 매수가</span><span style="color:var(--blue)">-- 손절가</span><span>▲매수 ▼매도 ●거부</span><span>휠: 확대 · 드래그: 이동</span></div></section>
  </div>

  <div class="grid3">
    <section class="px" aria-label="신호 검사"><h2>신호 검사 흐름 <span class="small muted" id="flowFor"></span></h2>
      <div class="small muted" style="margin-bottom:8px">돌파가 나오면 왼쪽부터 차례로 검사해요. 하나라도 NO 면 안 사요.</div>
      <div class="flow" id="flow"></div><div id="final" style="margin-top:12px"></div></section>
    <section class="px" aria-label="회의록"><div class="row" style="margin-bottom:8px"><h2 style="margin:0">회의록</h2>
      <div class="seg"><button class="btn on" id="sStock">이 종목 검사</button><button class="btn" id="sPre">장전 회의</button></div></div>
      <div class="feed" id="feed"></div></section>
  </div>
  <section class="px" aria-label="오늘 있었던 일"><h2>오늘 있었던 일</h2><div id="events"></div></section>
</div>
<div id="week" style="display:none;flex-direction:column;gap:16px"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const pct=(n,d=2)=>(n>0?'+':'')+(n||0).toFixed(d)+'%';
const cls=n=>n>0?'up':(n<0?'down':'muted');
const cache={};const put=(id,html)=>{if(cache[id]!==html){cache[id]=html;$(id).innerHTML=html}};
let S=null, sel=null, feedMode='stock', chart=null, cs=null, vs=null, lines=[], lastBarsKey='', lastResultId=0, talk={};

/* ── 픽셀 캐릭터 (16x20) ── */
const BODY=[
'....hhhhhhhh....','...hhhhhhhhhh...','..hhhhhhhhhhhh..','..hssssssssssh..','..hssssssssssh..',
'..sseesssseess..','..ssssssssssss..','...ssssmmssss....','....ssssssss....','...tttttttttt...',
'..tttttttttttt..','.sttttttttttttts','.sttttttttttttts','..tttttttttttt..','..pppppppppppp..',
'..ppppp..ppppp..','..ppppp..ppppp..','..ppppp..ppppp..','..kkkk....kkkk..','................'];
const SKIN=['#f2c9a0','#e0ac7e','#c68863','#f6d5b5'];
const LOOK={ // 역할별 옷·소품
 1:{t:'#41a6f6',h:'#3b2a1e',acc:'glasses'},2:{t:'#73eff7',h:'#1a1c2c',acc:'paper'},3:{t:'#94b0c2',h:'#5a3a22',acc:'glasses'},
 4:{t:'#ffcd75',h:'#b13e53',acc:''},5:{t:'#38b764',h:'#2b2b2b',acc:''},6:{t:'#ff6b6b',h:'#ef7d57',acc:'horn'},
 7:{t:'#3b5dc9',h:'#1a1c2c',acc:'ears'},8:{t:'#29366f',h:'#1a1c2c',acc:'tie'},9:{t:'#a7f070',h:'#3b2a1e',acc:'head'},
 10:{t:'#ef7d57',h:'#1a1c2c',acc:'head'},11:{t:'#41a6f6',h:'#ffcd75',acc:'head'},12:{t:'#f4f4f4',h:'#5a3a22',acc:'head'},
 13:{t:'#73eff7',h:'#2b2b2b',acc:'head'},14:{t:'#ffcd75',h:'#3b2a1e',acc:'head'},15:{t:'#ef7d57',h:'#1a1c2c',acc:'vest'},
 16:{t:'#38b764',h:'#5a3a22',acc:'phone'},17:{t:'#94b0c2',h:'#c0c0c0',acc:'glasses'},18:{t:'#b13e53',h:'#73eff7',acc:'hood'}};
function drawSprite(cv,no){
  const L=LOOK[no]||{t:'#94b0c2',h:'#333'};const sk=SKIN[no%SKIN.length];
  const c=cv.getContext('2d');cv.width=16;cv.height=20;c.clearRect(0,0,16,20);
  const col={h:L.h,s:sk,e:'#1a1c2c',m:'#b13e53',t:L.t,p:'#333c57',k:'#1a1c2c'};
  BODY.forEach((row,y)=>[...row].forEach((ch,x)=>{if(col[ch]){c.fillStyle=col[ch];c.fillRect(x,y,1,1)}}));
  const P=(x,y,w,h,f)=>{c.fillStyle=f;c.fillRect(x,y,w,h)};
  if(L.acc==='glasses'){P(3,5,4,1,'#1a1c2c');P(9,5,4,1,'#1a1c2c');P(7,5,2,1,'#1a1c2c')}
  if(L.acc==='tie'){P(7,9,2,5,'#ffcd75');P(2,9,2,4,'#1a1c2c');P(12,9,2,4,'#1a1c2c')}
  if(L.acc==='head'){P(1,3,2,4,'#1a1c2c');P(13,3,2,4,'#1a1c2c');P(2,0,12,1,'#1a1c2c');P(13,7,2,1,'#1a1c2c');P(11,8,3,1,'#1a1c2c')}
  if(L.acc==='horn'){P(2,0,2,2,'#f4f4f4');P(12,0,2,2,'#f4f4f4')}
  if(L.acc==='ears'){P(1,0,3,3,L.h);P(12,0,3,3,L.h)}
  if(L.acc==='vest'){P(4,10,8,1,'#ffcd75');P(4,12,8,1,'#ffcd75')}
  if(L.acc==='phone'){P(13,4,2,4,'#1a1c2c')}
  if(L.acc==='paper'){P(12,11,4,4,'#f4f4f4')}
  if(L.acc==='hood'){P(1,2,2,8,L.t);P(13,2,2,8,L.t);P(6,10,4,3,'#ffcd75')}
}
/* 자리 배치 (1400x560 장면 좌표) */
const SEATS={1:[96,256],2:[186,256],3:[276,256],4:[366,256],5:[96,436],6:[186,436],7:[276,436],8:[366,436],
 9:[500,262],10:[606,262],11:[712,262],12:[818,262],13:[553,428],14:[659,428],18:[765,428],15:[966,262],16:[1090,262],17:[1050,430]};
const SHORT={1:'매크로',2:'뉴스',3:'공시',4:'테마',5:'수급',6:'강세론',7:'약세론',8:'PM',9:'거래량',10:'ORB',11:'매수세',12:'뉴스확인',13:'시장',14:'VI',15:'리스크',16:'주문',17:'복기',18:'타임머신'};
function buildScene(){

  <section class="px"><h2>요일별 일 수익률</h2><div style="display:flex;gap:12px;height:170px">${days.map(d=>{const h=Math.abs(d.ret_pct)/mx*70;return `<div style="flex:1;position:relative"><div style="position:absolute;left:20%;right:20%;${d.ret_pct>=0?'bottom:50%':'top:50%'};height:${h}px;background:${d.ret_pct>=0?'#ff6b6b':'#41a6f6'};border:3px solid #1a1c2c"></div><div class="small" style="position:absolute;left:0;right:0;text-align:center;${d.ret_pct>=0?'bottom:calc(50% + '+(h+6)+'px)':'top:calc(50% + '+(h+6)+'px)'}">${pct(d.ret_pct)}</div><div class="small muted" style="position:absolute;bottom:0;left:0;right:0;text-align:center">${d.date.slice(4,6)}/${d.date.slice(6)}</div></div>`}).join('')||'<div class="empty">아직 기록이 없어요.</div>'}</div></section>
  <section class="px"><h2>손실 거래 원인 분석 → 수정 → 재시험</h2>${(r.log||['토요일 주간 복기 후 표시돼요.']).map(x=>`<div class="ev"><span>${esc(x)}</span></div>`).join('')}</section>
  <section class="px"><h2>에이전트 성적표</h2>${sc.length?`<div style="overflow-x:auto"><table><tr><th>에이전트</th><th>거부</th><th>채점</th><th>거부가 옳았던 비율</th><th>피한 손실(%)</th></tr>${sc.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.rejects}</td><td>${x.scored}</td><td>${x.right_rate!=null?x.right_rate.toFixed(0)+'%':'-'}</td><td>${(x.avoided_pct||0).toFixed(2)}</td></tr>`).join('')}</table></div>`:'<div class="empty">이번 주 거부된 신호 없음</div>'}</section>
  <section class="px"><h2>다음 주 설정 변경안</h2>${(W.proposals||[]).map(p=>`<div class="ev"><span><b>${p.id}번</b> · ${esc(p.status)} · ${esc(p.changes)}<br><span class="small muted">텔레그램 /apply ${p.id} 또는 /hold ${p.id}</span></span></div>`).join('')||'<div class="empty">변경안 없음</div>'}</section>
  ${(r.panel||[]).length?`<section class="px"><h2>투자 대가 패널 (참고용)</h2>${r.panel.map(x=>`<div class="ev"><span><b>${esc(x.name)}</b> ${esc(x.view)}</span></div>`).join('')}</section>`:''}`;
}
buildScene();tick();setInterval(tick,3000);setInterval(()=>{if(S) renderAgents()},1000);
</script>
</body>
</html>
