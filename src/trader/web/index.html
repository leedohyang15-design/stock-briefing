<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI 단타 트레이딩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="/vendor/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#0D1117;--panel:#161B22;--line:#30363D;--line2:#21262D;--text:#E6EDF3;--muted:#9DA7B3;--dim:#8B949E;
--up:#FF7B72;--upbg:#2D1517;--down:#3D8BFF;--downt:#79B8FF;--ok:#56D364;--okbg:#12261A;--warn:#F2CC60;--warnbg:#2A2111;--accent:#1F6FEB}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR',system-ui,sans-serif;font-size:14px;line-height:1.5}
.mono{font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1440px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;min-width:0}
h2{margin:0 0 10px;font-size:15px;font-weight:700}
h3{margin:0 0 8px;font-size:13px;font-weight:500;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:12px}
.up{color:var(--up)}.down{color:var(--downt)}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:36px;height:36px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500}
.dot{width:8px;height:8px;border-radius:50%}
.tabs{display:flex;gap:4px;background:var(--panel);padding:4px;border-radius:10px;border:1px solid var(--line)}
.tabs button{border:0;border-radius:8px;padding:8px 16px;min-height:40px;font:inherit;cursor:pointer;background:transparent;color:#C9D1D9}
.tabs button.on{background:var(--accent);color:#fff;font-weight:700}
/* 지금 하는 일 */
.banner{display:flex;gap:14px;align-items:flex-start}
.banner .ico{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;flex:none}
.banner .now{font-size:18px;font-weight:700}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin-top:14px}
.step{border-radius:8px;padding:8px 10px;background:#0D1117;border:1px solid var(--line2)}
.step .t{font-size:13px;font-weight:500}.step .s{font-size:11px;color:var(--dim)}
.step.done{border-color:#1f3b2a}.step.done .t{color:var(--ok)}
.step.cur{border-color:var(--accent);background:#0F2740}.step.cur .t{color:#fff}
/* KPI */
.kpis{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}
.big{font-size:38px;font-weight:600}.mid{font-size:22px;font-weight:600}
.bar{height:8px;background:var(--line2);border-radius:4px;overflow:hidden;margin-top:8px}.bar>div{height:8px}
/* main grid */
.main{display:grid;grid-template-columns:380px minmax(0,1fr);gap:14px}
.stock{display:grid;grid-template-columns:1fr auto;gap:2px 8px;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;background:#0D1117;cursor:pointer;margin-bottom:8px;width:100%;text-align:left;color:inherit;font:inherit}
.stock.sel{border-color:var(--accent);background:#0F2740}
.stock .nm{font-weight:700}
.chip{font-size:11px;font-weight:500;padding:2px 8px;border-radius:999px;white-space:nowrap}
.c-watch{background:#21262D;color:#C9D1D9}.c-pending{background:var(--warnbg);color:var(--warn)}.c-hold{background:var(--upbg);color:#FFA198}
.c-blocked{background:#21262D;color:var(--dim)}.c-done{background:var(--okbg);color:var(--ok)}
.orb{position:relative;height:6px;background:var(--line2);border-radius:3px;margin-top:6px;grid-column:1/3}
.orb .rng{position:absolute;top:0;height:6px;background:rgba(121,184,255,.35);border-radius:3px}
.orb .px{position:absolute;top:-3px;width:3px;height:12px;background:var(--warn);border-radius:2px}
#chart{height:440px;border-radius:8px;overflow:hidden;border:1px solid var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12px;color:var(--muted);margin-top:8px}
.sw{display:inline-block;width:14px;height:0;border-top:2px dashed;vertical-align:middle;margin-right:4px}
/* agents */
.room{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.node{display:flex;flex-direction:column;align-items:center;width:78px;text-align:center}
.node .c{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;border:2px solid var(--line);background:#0D1117;font-size:15px}
.node .n{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.2}
.node.pass .c{border-color:var(--ok);color:var(--ok)}.node.reject .c{border-color:var(--up);color:var(--up);background:var(--upbg)}
.node.wait .c{border-color:var(--warn);color:var(--warn)}.node.none .c{color:var(--dim)}
.arrow{color:var(--dim);font-size:12px}
.feed{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow:auto;padding-right:4px}
.msg{display:flex;gap:10px;align-items:flex-start}
.av{width:34px;height:34px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#0D1117}
.bubble{background:#0D1117;border:1px solid var(--line2);border-radius:4px 12px 12px 12px;padding:8px 12px;max-width:100%}
.bubble .who{font-size:12px;color:var(--muted);display:flex;gap:8px;align-items:center}
.bubble.reject{border-color:#5a2a2e}.bubble.pass{border-color:#1f3b2a}
.sep{font-size:12px;color:var(--muted);text-align:center;border-top:1px solid var(--line2);padding-top:8px}
.seg{display:flex;gap:4px;margin-bottom:10px}.seg button{border:1px solid var(--line);background:#0D1117;color:#C9D1D9;border-radius:8px;padding:6px 12px;font:inherit;font-size:13px;cursor:pointer;min-height:36px}
.seg button.on{border-color:var(--accent);background:#0F2740;color:#fff}
.tm{display:flex;height:22px;border-radius:6px;overflow:hidden;font-size:11px;font-weight:600;margin:6px 0}
.tm div{display:flex;align-items:center;justify-content:center;color:#0D1117;min-width:0;overflow:hidden;white-space:nowrap}
.ev{display:flex;gap:10px;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13px}
.ev .t{color:var(--dim);width:60px;flex:none}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid var(--line2);text-align:left}th{color:var(--muted);font-weight:500}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
@media (max-width:1100px){.main,.room{grid-template-columns:minmax(0,1fr)}.kpis{grid-template-columns:1fr 1fr}}
@media (max-width:640px){.steps{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr}.big{font-size:30px}#chart{height:320px}.wrap{padding:12px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <div class="brand">
    <div class="logo"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" aria-hidden="true"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/></svg></div>
    <div><div style="font-size:20px;font-weight:700">AI 단타 트레이딩</div><div class="small muted" id="sub">에이전트 18개 · 불러오는 중…</div></div>
    <span class="pill" id="mode"></span>
  </div>
  <nav class="tabs" aria-label="화면"><button id="tToday" class="on">오늘</button><button id="tWeek">주간 복기</button></nav>
</header>

<div id="today" style="display:flex;flex-direction:column;gap:14px">
  <section class="panel" aria-label="지금 하는 일">
    <div class="banner"><div class="ico" id="bIco">⏳</div>
      <div style="min-width:0"><div class="small muted">지금 하는 일</div><div class="now" id="bNow">불러오는 중…</div>
      <div class="muted" style="margin-top:4px"><b style="color:#C9D1D9">다음 →</b> <span id="bNext"></span></div></div></div>
    <div class="steps" id="steps"></div>
  </section>

  <section class="kpis" id="kpis"></section>

  <div class="main">
    <section class="panel" aria-label="관심종목">
      <h2>오늘 지켜보는 종목 <span class="small muted" id="ipCount"></span></h2>
      <div class="small muted" style="margin-bottom:10px">평소보다 거래량이 몰린 종목. 막대 = 시가범위(파랑) 대비 현재가(노랑). 오른쪽 끝을 넘으면 '돌파'.</div>
      <div id="stocks"></div>
      <h2 style="margin-top:16px">오늘의 증시</h2><div id="market"></div>
    </section>
    <section class="panel" aria-label="차트">
      <div style="display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:baseline">
        <h2 id="cTitle">차트</h2><div class="small muted" id="cInfo"></div></div>
      <div id="chart"></div>
      <div class="legend"><span><span class="sw" style="border-color:#79B8FF"></span>시가범위 상·하단</span><span><span class="sw" style="border-color:#F2CC60"></span>정적 VI</span>
        <span><span class="sw" style="border-color:#F2CC60;border-top-style:solid"></span>매수가</span><span><span class="sw" style="border-color:#3D8BFF"></span>손절가</span>
        <span>▲ 매수 · ▼ 매도 · ● 거부된 신호</span><span>휠: 확대 · 드래그: 이동</span></div>
    </section>
  </div>

  <div class="room">
    <section class="panel" aria-label="신호 검사 흐름">
      <h2>신호 검사 흐름 <span class="small muted" id="flowFor"></span></h2>
      <div class="small muted" style="margin-bottom:10px">시가범위 돌파가 나오면 왼쪽부터 차례로 검사해요. 하나라도 ✖ 이면 사지 않아요.</div>
      <div class="flow" id="flow"></div>
      <div id="final" style="margin-top:14px"></div>
    </section>
    <section class="panel" aria-label="에이전트 대화">
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><h2>에이전트 회의실</h2>
        <div class="seg"><button id="sStock" class="on">이 종목 검사</button><button id="sPre">장전 회의</button></div></div>
      <div class="feed" id="feed"></div>
    </section>
  </div>

  <section class="panel" aria-label="타임라인"><h2>오늘 있었던 일</h2><div id="events"></div></section>
</div>

<div id="week" style="display:none;flex-direction:column;gap:14px"></div>
</div>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const won=n=>Math.round(n||0).toLocaleString('ko-KR');
const pct=(n,d=2)=>(n>0?'+':'')+(n||0).toFixed(d)+'%';
const cls=n=>n>0?'up':(n<0?'down':'muted');
const TEAM=n=>n<=8?'#A371F7':(n===15?'#F0883E':(n===16?'#3FB950':(n===17?'#8B949E':(n===18?'#DB61A2':'#58A6FF'))));
const cache={};const put=(id,html)=>{if(cache[id]!==html){cache[id]=html;$(id).innerHTML=html}};
let S=null, sel=null, feedMode='stock', chart=null, cs=null, vs=null, lines=[], lastBarsKey='';

$('tToday').onclick=()=>{$('tToday').classList.add('on');$('tWeek').classList.remove('on');$('today').style.display='flex';$('week').style.display='none'};
$('tWeek').onclick=()=>{$('tWeek').classList.add('on');$('tToday').classList.remove('on');$('today').style.display='none';$('week').style.display='flex';loadWeek()};
$('sStock').onclick=()=>{feedMode='stock';$('sStock').classList.add('on');$('sPre').classList.remove('on');renderFeed()};
$('sPre').onclick=()=>{feedMode='pre';$('sPre').classList.add('on');$('sStock').classList.remove('on');renderFeed()};

function renderHeader(){
  const st=S.status||{};const live=st.mode==='live';
  $('mode').innerHTML=S.alive?`<span class="dot" style="background:${live?'#FF7B72':'#56D364'}"></span>${live?'실계좌':'모의투자 (실제 주문 없음)'}`:'<span class="dot" style="background:#8B949E"></span>꺼짐';
  $('mode').style.cssText=S.alive?(live?'background:#2D1517;color:#FFA198':'background:#12261A;color:#56D364'):'background:#21262D;color:#9DA7B3';
  $('sub').textContent=`에이전트 18개 · ${S.now.slice(0,10)} ${S.now.slice(11,19)} · 3초마다 자동 갱신`;
  const b=S.banner, ic={ok:['🟢','#12261A'],warn:['⏸','#2A2111'],stop:['⛔','#2D1517'],idle:['🌙','#21262D']}[b.tone]||['ℹ️','#21262D'];
  $('bIco').textContent=ic[0];$('bIco').style.background=ic[1];$('bNow').textContent=b.now;$('bNext').textContent=b.next;
  const order=S.phase.steps.map(s=>s[0]), curI=S.phase.key==='ready'?1:order.indexOf(S.phase.key), h=S.phase.history||{};
  put('steps',S.phase.steps.map(([k,t,tm],i)=>{const c=i<curI||S.phase.key==='done'?'done':(i===curI?'cur':'');
    const at=h[k]?h[k].slice(11,16)+' 시작':tm;return `<div class="step ${c}"><div class="t">${c==='done'?'✔ ':(c==='cur'?'▶ ':'')}${t}</div><div class="s">${at}</div></div>`}).join(''));
}
function renderKpis(){
  const s=S.status||{};const lim=s.loss_limit_amt||0, room=s.loss_room??lim, used=lim?Math.max(0,Math.min(100,(1-room/lim)*100)):0;
  const rg=s.regime||{};const ok=rg.decision==='pass';
  put('kpis',`<div class="panel"><div class="small muted">일 수익률 (수수료·세금 뺀 값)</div>
   <div style="display:flex;gap:12px;align-items:baseline;flex-wrap:wrap"><span class="big mono ${cls(s.ret_pct)}">${pct(s.ret_pct)}</span><span class="mid mono ${cls(s.pnl)}">${(s.pnl>0?'+':'')+won(s.pnl)}원</span></div>
   <div class="small muted">시작 ${won(s.start_equity)}원 · 실현 ${won(s.realized)} · 보유평가 ${won(s.unrealized)}</div></div>
  <div class="panel"><div class="small muted">손실 한도까지</div><div class="mid mono">${won(room)}원</div><div class="bar"><div style="width:${used}%;background:${used>66?'#FF7B72':'#F2CC60'}"></div></div><div class="small muted">-${won(lim)}원이면 오늘 매매 중단</div></div>
  <div class="panel"><div class="small muted">오늘 거래</div><div class="mid">${s.wins||0}승 ${s.losses||0}패</div><div class="small muted">매수 ${s.entries||0}/${s.max_entries||0}회 · 보유 ${(s.positions||[]).length}/${s.max_positions||0}종목</div></div>
  <div class="panel"><div class="small muted">시장 분위기 (13번)</div><div class="mid" style="color:${rg.decision?(ok?'#56D364':'#FF7B72'):'#9DA7B3'}">${rg.decision?(ok?'매수 허용':'매수 쉬는 중'):'-'}</div><div class="small muted">${esc(rg.reason||'장중에 표시돼요')}</div></div>`);
}
function chipOf(i){const k=i.label==='보유 중'?'hold':(i.status==='pending'?'pending':(i.status==='blocked'?'blocked':(i.status==='done'?'done':'watch')));return `<span class="chip c-${k}">${esc(i.label)}</span>`}
function renderStocks(){
  const ip=S.inplay||[];$('ipCount').textContent=ip.length?`${ip.length}종목`:'';
  if(!sel||!ip.find(i=>i.code===sel)) sel=(ip.find(i=>i.label==='보유 중')||ip[0]||{}).code||null;
  put('stocks',ip.length?ip.map(i=>{const lo=i.or_low,hi=i.or_high,p=i.price||i.or_high, span=(hi-lo)||1, mn=Math.min(lo-span,p), mx=Math.max(hi+span,p), w=mx-mn||1;
    const toB=p>hi?'돌파함':`돌파까지 ${pct((hi-p)/p*100,1)}`;const pos=i.position?` · ${pct((p-i.position.avg_price)/i.position.avg_price*100)}`:'';
    return `<button class="stock ${i.code===sel?'sel':''}" data-c="${i.code}"><span class="nm">${esc(i.name)} <span class="small muted mono">${i.code}</span></span>${chipOf(i)}
    <span class="small"><span class="mono">${won(i.price)}</span> <span class="${cls(i.change_pct)}">${pct(i.change_pct)}</span> · 거래량 평소 ${(i.relvol||0).toFixed(1)}배${pos}</span><span class="small ${p>hi?'up':'muted'}">${toB}</span>
    <span class="orb"><span class="rng" style="left:${(lo-mn)/w*100}%;width:${span/w*100}%"></span><span class="px" style="left:calc(${(p-mn)/w*100}% - 1px)"></span></span>
    ${i.note?`<span class="small muted" style="grid-column:1/3">${esc(i.note)}</span>`:''}</button>`}).join(''):'<div class="empty">09:05 이후 거래량이 몰린 종목을 골라 여기에 보여줘요.</div>');
  document.querySelectorAll('.stock').forEach(b=>b.onclick=()=>{sel=b.dataset.c;cache.stocks='';renderAll(true)});
  const s=S.status||{}, idx=s.index||{}, pre=S.premarket||{};
  put('market',`<div class="small" style="display:grid;grid-template-columns:1fr auto;gap:4px 8px">
    <span>코스피 (실시간)</span><span class="mono ${cls(idx.KOSPI)}">${idx.KOSPI!=null?pct(idx.KOSPI):'-'}</span>
    <span>코스닥 (실시간)</span><span class="mono ${cls(idx.KOSDAQ)}">${idx.KOSDAQ!=null?pct(idx.KOSDAQ):'-'}</span></div>
    <div class="small muted" style="margin-top:8px">${(pre.market_lines||[]).slice(0,6).map(esc).join('<br>')||'장전 분석 후 표시돼요'}</div>`);
}
function initChart(){
  if(chart||!window.LightweightCharts) return;
  chart=LightweightCharts.createChart($('chart'),{autoSize:true,layout:{background:{color:'#0D1117'},textColor:'#9DA7B3',fontFamily:'Noto Sans KR'},
    grid:{vertLines:{color:'#161B22'},horzLines:{color:'#161B22'}},rightPriceScale:{borderColor:'#30363D'},
    timeScale:{borderColor:'#30363D',timeVisible:true,secondsVisible:false},crosshair:{mode:0},
    localization:{priceFormatter:p=>Math.round(p).toLocaleString('ko-KR'),timeFormatter:t=>{const d=new Date(t*1000);return String(d.getUTCHours()).padStart(2,'0')+':'+String(d.getUTCMinutes()).padStart(2,'0')}}});
  cs=chart.addCandlestickSeries({upColor:'#FF7B72',downColor:'#3D8BFF',borderVisible:false,wickUpColor:'#FF7B72',wickDownColor:'#3D8BFF'});
  cs.priceScale().applyOptions({scaleMargins:{top:0.08,bottom:0.26}});
  vs=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'',color:'rgba(157,167,179,.35)',lastValueVisible:false,priceLineVisible:false});
  vs.priceScale().applyOptions({scaleMargins:{top:0.78,bottom:0}});
}
const T=(d,hm)=>Date.UTC(+d.slice(0,4),+d.slice(4,6)-1,+d.slice(6,8),+hm.slice(0,2),+hm.slice(2,4))/1000;
async function renderChart(force){
  initChart(); if(!chart) return;
  const ip=(S.inplay||[]).find(i=>i.code===sel);
  $('cTitle').textContent=ip?`${ip.name} · 1분봉`:'차트';
  $('cInfo').innerHTML=ip?`현재가 <b class="mono">${won(ip.price)}</b> <span class="${cls(ip.change_pct)}">${pct(ip.change_pct)}</span> · 시가범위 ${won(ip.or_low)}~${won(ip.or_high)} · ATR ${won(ip.atr)}`:'관심종목이 정해지면 표시돼요';
  if(!sel){cs.setData([]);vs.setData([]);return}
  const key=sel+'|'+Math.floor(Date.now()/10000);
  if(!force&&key===lastBarsKey) return; lastBarsKey=key;
  const bars=await (await fetch('/api/bars?code='+sel)).json();
  cs.setData(bars.map(b=>({time:T(b.date,b.time),open:b.open,high:b.high,low:b.low,close:b.close})));
  vs.setData(bars.map(b=>({time:T(b.date,b.time),value:b.volume,color:b.close>=b.open?'rgba(255,123,114,.35)':'rgba(61,139,255,.35)'})));
  lines.forEach(l=>cs.removePriceLine(l));lines=[];
  const L=(p,c,t,st=2)=>{if(p) lines.push(cs.createPriceLine({price:p,color:c,lineWidth:1,lineStyle:st,axisLabelVisible:true,title:t}))};
  if(ip){L(ip.or_high,'#79B8FF','시가범위 상단');L(ip.or_low,'#79B8FF','하단');L(ip.vi_upper,'#F2CC60','정적 VI');
    if(ip.position){L(ip.position.avg_price,'#F2CC60','매수',0);L(ip.position.stop,'#3D8BFF','손절')}}
  const d=bars.length?bars[0].date:S.now.slice(0,10).replace(/-/g,'');const mk=[];
  (S.trades||[]).filter(t=>t.code===sel).forEach(t=>{mk.push({time:T(d,t.entry_ts.slice(11,16).replace(':','')),position:'belowBar',color:'#F2CC60',shape:'arrowUp',text:'매수'});
    if(t.exit_ts) mk.push({time:T(d,t.exit_ts.slice(11,16).replace(':','')),position:'aboveBar',color:t.net_pnl>0?'#FF7B72':'#79B8FF',shape:'arrowDown',text:t.exit_reason})});
  (S.signals||[]).filter(g=>g.code===sel&&['rejected','expired'].includes(g.status)).forEach(g=>mk.push({time:T(d,g.ts.slice(11,16).replace(':','')),position:'aboveBar',color:'#8B949E',shape:'circle',text:'거부'}));
  cs.setMarkers(mk.sort((a,b)=>a.time-b.time));
  if(force) chart.timeScale().fitContent();
}
const FLOW=[[9,'거래량'],[10,'돌파'],[13,'시장'],[14,'VI'],[11,'매수세'],[15,'리스크'],[18,'타임머신'],[12,'뉴스'],['A','내 승인'],[16,'주문']];
function latestSignal(){return (S.signals||[]).find(g=>g.code===sel)}
function renderFlow(){
  const ip=(S.inplay||[]).find(i=>i.code===sel);$('flowFor').textContent=ip?'· '+ip.name:'';
  const sig=latestSignal();const res={};(S.results||[]).filter(r=>sig&&r.signal_id===sig.id).forEach(r=>res[r.no]=r);
  const icon={pass:'✔',reject:'✖',wait:'⏳',info:'i',none:'·'};
  const nodes=FLOW.map(([no,label])=>{let d='none';
    if(no==='A'){if(sig){d=sig.status==='pending'?'wait':(['filled','unfilled'].includes(sig.status)?'pass':(/사용자|시간 초과|가격/.test(sig.reason||'')?'reject':'none'))}}
    else if(res[no]) d=res[no].decision==='info'?'pass':res[no].decision;
    else if(!sig&&ip){d=no===9?'pass':(no===10?'wait':'none')}
    const tip=no==='A'?(sig?sig.reason:''):(res[no]?res[no].reason:'');
    return `<div class="node ${d}" title="${esc(tip)}"><div class="c">${icon[d]}</div><div class="n">${no==='A'?'':no+' '}${label}</div></div>`}).join('<span class="arrow">›</span>');
  put('flow',ip?nodes:'<div class="empty">관심종목이 정해지면 검사 과정을 보여줘요.</div>');
  let fin='';
  if(sig){const lab={pending:['승인 대기','#F2CC60'],filled:['매수 · 체결','#FF7B72'],rejected:['거부 · 사지 않음','#79B8FF'],expired:['취소','#9DA7B3'],unfilled:['미체결','#9DA7B3'],checking:['검사 중','#9DA7B3']}[sig.status]||[sig.status,'#9DA7B3'];
    const tm=res[18]&&res[18].data||{};
    fin=`<div class="panel" style="background:#0D1117"><div class="small muted">최종 판단 · ${sig.ts.slice(11,16)} 신호</div><div class="mid" style="color:${lab[1]}">${lab[0]}</div>
     <div class="small">${esc(sig.reason||'')}</div><div class="small muted">신호가 ${won(sig.price)} · 손절 ${won(sig.stop)} · 수량 ${sig.qty||0}주</div>
     ${tm.p_stop!=null?`<div class="small" style="margin-top:8px">18 타임머신: 남은 장을 10,000번 돌려본 결과 (기대수익 <b class="${cls(tm.ev_pct)}">${pct(tm.ev_pct)}</b>)</div>
     <div class="tm"><div style="width:${tm.p_eod_profit}%;background:#FF7B72">${tm.p_eod_profit>12?'마감 수익 '+tm.p_eod_profit.toFixed(0)+'%':''}</div><div style="width:${tm.p_stop}%;background:#3D8BFF">${tm.p_stop>12?'손절 '+tm.p_stop.toFixed(0)+'%':''}</div><div style="flex:1;background:#30363D;color:#E6EDF3">${tm.p_eod_loss>12?'마감 손실 '+tm.p_eod_loss.toFixed(0)+'%':''}</div></div>`:''}</div>`}
  else if(ip) fin=`<div class="small muted">아직 신호 없음 — 현재가가 시가범위 상단(${won(ip.or_high)})을 넘으면 검사가 시작돼요.</div>`;
  put('final',fin);
}
function bubble(no,name,text,dec,ts){return `<div class="msg"><div class="av" style="background:${TEAM(no)}">${no}</div><div class="bubble ${dec||''}"><div class="who"><b style="color:#E6EDF3">${esc(name)}</b>${ts?'<span class="mono">'+ts+'</span>':''}</div><div>${esc(text)}</div></div></div>`}
function renderFeed(){
  if(!S) return; let html='';
  if(feedMode==='pre'){const pre=S.premarket||{};const rs=(pre.results||[]);
    html=rs.length?rs.filter(r=>r.no<=5||r.no===8).map(r=>bubble(r.no,S.names[r.no],r.reason,'',null)).join(''):'<div class="empty">08:00 장전 회의가 끝나면 1~8번 에이전트 의견이 나와요.</div>';
    if(sel){const b=(pre.bull||{})[sel], br=(pre.bear||{})[sel];if(b||br) html+=`<div class="sep">이 종목 토론</div>`+(b?bubble(6,'강세론자',b,'pass'):'')+(br?bubble(7,'약세론자',br,'reject'):'')}
  } else {
    const rs=(S.results||[]).filter(r=>r.code===sel&&r.signal_id).slice().reverse();
    let last=null;
    rs.forEach(r=>{if(r.signal_id!==last){last=r.signal_id;const g=(S.signals||[]).find(x=>x.id===r.signal_id);html+=`<div class="sep">📈 ${r.ts.slice(11,16)} 시가범위 돌파 신호 → 검사 시작</div>`}
      html+=bubble(r.no,S.names[r.no]||r.agent,r.line,r.decision,r.ts.slice(11,16))});
    if(!rs.length){const ip=(S.inplay||[]).find(i=>i.code===sel);
      html=ip?bubble(9,'Stocks in Play',`거래량이 평소의 ${(ip.relvol||0).toFixed(1)}배라 오늘 지켜볼 종목으로 골랐어요.`,'pass')+bubble(10,'ORB 신호',`시가범위 ${won(ip.or_low)}~${won(ip.or_high)}. 현재가 ${won(ip.price)} — 상단을 넘으면 알려줄게요.`,'wait'):'<div class="empty">관심종목이 정해지면 에이전트들의 대화가 여기에 나와요.</div>'}
    const rg=(S.status||{}).regime;if(rg&&rg.decision==='reject') html+=`<div class="sep">지금 시장 상황</div>`+bubble(13,'시장 분위기',rg.reason+'. 지금은 사지 말자 ✋','reject');
  }
  put('feed',html);
}
function renderEvents(){put('events',(S.events||[]).length?S.events.map(e=>`<div class="ev"><span class="t mono">${e.ts.slice(11,19)}</span><span>${esc(e.line)}</span></div>`).join(''):'<div class="empty">아직 기록이 없어요.</div>')}
function renderAll(force){renderHeader();renderKpis();renderStocks();renderChart(force);renderFlow();renderFeed();renderEvents()}
async function tick(){try{const prev=sel;S=await (await fetch('/api/state')).json();renderAll(prev!==sel||!lastBarsKey)}catch(e){$('bNow').textContent='대시보드 서버와 연결이 끊겼어요. 실행 창이 켜져 있는지 확인해 주세요.'}}
async function loadWeek(){
  const W=await (await fetch('/api/week')).json();const r=W.report||{}, m=r.metrics||{};
  const days=W.days||[];const mx=Math.max(1,...days.map(d=>Math.abs(d.ret_pct||0)));
  const sc=r.scorecard||[];
  $('week').innerHTML=`<section class="kpis"><div class="panel"><div class="small muted">주간 누적 수익률</div><div class="big mono ${cls(m.cum_ret_pct)}">${pct(m.cum_ret_pct)}</div></div>
   <div class="panel"><div class="small muted">승률 (${m.trades||0}건)</div><div class="mid">${m.trades?(m.win_rate||0).toFixed(0)+'%':'-'}</div></div>
   <div class="panel"><div class="small muted">평균 손익비</div><div class="mid">${m.payoff?m.payoff.toFixed(2):'-'}</div></div>
   <div class="panel"><div class="small muted">최대 손실일</div><div class="mid mono ${cls(m.worst_day)}">${pct(m.worst_day)}</div></div></section>
  <section class="panel"><h2>요일별 일 수익률</h2><div style="display:flex;gap:12px;align-items:center;height:180px;position:relative;border-bottom:0">${days.map(d=>{const h=Math.abs(d.ret_pct)/mx*80;return `<div style="flex:1;height:180px;position:relative"><div style="position:absolute;left:20%;right:20%;${d.ret_pct>=0?'bottom:50%':'top:50%'};height:${h}px;background:${d.ret_pct>=0?'#FF7B72':'#3D8BFF'};border-radius:3px"></div><div class="small mono" style="position:absolute;left:0;right:0;text-align:center;${d.ret_pct>=0?'bottom:calc(50% + '+(h+4)+'px)':'top:calc(50% + '+(h+4)+'px)'}">${pct(d.ret_pct)}</div><div class="small muted" style="position:absolute;bottom:-2px;left:0;right:0;text-align:center">${d.date.slice(4,6)}/${d.date.slice(6)}</div></div>`}).join('')||'<div class="empty">아직 기록이 없어요.</div>'}</div></section>
  <section class="panel"><h2>손실 거래 원인 분석 → 수정 → 재시험</h2>${(r.log||['토요일 주간 복기 후 표시돼요.']).map(x=>`<div class="ev"><span>${esc(x)}</span></div>`).join('')}</section>
  <section class="panel"><h2>에이전트 성적표 <span class="small muted">거부한 신호를 샀다면 어땠을지 채점</span></h2>${sc.length?`<div style="overflow-x:auto"><table><tr><th>에이전트</th><th>거부</th><th>채점</th><th>거부가 옳았던 비율</th><th>피한 손실 합(%)</th></tr>${sc.map(x=>`<tr><td>${esc(x.name)}</td><td class="mono">${x.rejects}</td><td class="mono">${x.scored}</td><td class="mono">${x.right_rate!=null?x.right_rate.toFixed(0)+'%':'-'}</td><td class="mono">${(x.avoided_pct||0).toFixed(2)}</td></tr>`).join('')}</table></div>`:'<div class="empty">이번 주 거부된 신호 없음</div>'}</section>
  <section class="panel"><h2>다음 주 설정 변경안</h2>${(W.proposals||[]).map(p=>`<div class="ev"><span><b>${p.id}번</b> · ${esc(p.status)} · <span class="mono">${esc(p.changes)}</span><br><span class="small muted">텔레그램 /apply ${p.id} 또는 /hold ${p.id}</span></span></div>`).join('')||'<div class="empty">변경안 없음 (표본 30건 이상 + 과거·최근 구간 모두 개선될 때만 제안)</div>'}</section>
  ${(r.panel||[]).length?`<section class="panel"><h2>투자 대가 패널 <span class="small muted">참고용 · 단타 판단에 안 씀</span></h2>${r.panel.map(x=>`<div class="ev"><span><b>${esc(x.name)}</b> ${esc(x.view)}</span></div>`).join('')}</section>`:''}`;
}
