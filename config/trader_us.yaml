# 미장(미국 주식) 모의투자 설정 — 시간은 모두 뉴욕 현지 시각 (한국보다 14시간, 서머타임엔 13시간 늦음)
# 금액 단위는 달러(USD). 항목 이름의 _krw 는 국장 설정과 이름을 맞춘 것일 뿐 달러로 읽는다.
# 미장은 아직 모의투자 전용 (실계좌 해외주식 주문은 연결하지 않음).
version: 1

risk:
  max_order_krw: 300           # 1회 주문 최대 금액 (달러, 약 40만원). 미국은 100달러 넘는 종목이 많아 국장보다 크게
  max_positions: 2
  max_entries_per_day: 5
  daily_loss_limit_pct: 3.0
  risk_per_trade_pct: 1.0
  one_entry_per_stock: true
  entry_end: "15:40"           # 신규 진입 마감 (뉴욕)
  flatten_time: "15:50"        # 전량 청산 (정규장 16:00 마감 10분 전)

strategy:
  orb_minutes: 5               # 논문(미국 시장 연구) 기본값
  require_bullish_or: true
  stop_atr_mult: 0.10          # 논문 원래 값
  min_stop_ticks: 5            # 5센트
  min_stop_cost_mult: 2.0
  atr_days: 14
  relvol_min: 1.0
  relvol_top_n: 10
  open_volume_share: 0.04      # (예비) 실측 데이터 10일 미만일 때 추정 비율
  relvol_min_days: 10
  min_price: 5                 # 논문: 주가 5달러 이상
  min_avg_value_krw: 20000000  # 14일 평균 거래대금 2천만 달러 이상 (논문: 평균 거래량 100만 주 이상)
  min_atr_pct: 1.5
  imbalance_trades: 30
  imbalance_min: 0.0
  imbalance_require_data: false  # 체결 데이터를 못 받으면 거부하지 않고 '참고'로만
  static_vi_pct: 0             # 미국은 정적 VI 제도 없음 → VI 감시 생략 (대신 LULD 급변 정지는 시세로만 반영)
  vi_guard_pct: 0
  regime_block_below_pct: -1.0 # SPY·QQQ 평균이 -1% 미만이면 신규 진입 중단

timemachine:
  enabled: true
  lookback_days: 59
  min_days: 10
  paths: 10000
  seed: 19
  reject_if_ev_below_pct: 0.0

news:
  lookback_hours: 24
  llm_required: true
  reject_keywords: [offering, dilution, "public offering", halt, halted, delist, bankruptcy, "chapter 11",
                    investigation, subpoena, "SEC charges", fraud, "going concern", "reverse split", downgrade,
                    recall, lawsuit, "class action", 유상증자, 상장폐지, 거래정지, 파산, 소송, 하향]

approval:
  mode: telegram
  paper_mode: auto
  timeout_sec: 180

execution:
  slippage_ticks: 1

costs:                         # 확인 필요: 한국투자증권 해외주식 수수료 (이벤트 요율이면 더 낮음)
  fee_pct: 0.09                # 매수·매도 각각
  sell_tax_pct: 0.003          # 미국 SEC 수수료 등 (근사)

schedule:
  premarket_start: "09:00"     # 뉴욕 09:00 = 한국 23:00 (서머타임 22:00)
  loop_interval_sec: 5
  review_time: "16:05"

kis:
  rate_per_sec_real: 15
  rate_per_sec_mock: 2
  tr: {}

weekly:
  min_samples: 50
  max_param_changes: 2
  max_iterations: 3
  holdout_days: 5
  levers:
    orb_minutes: [5, 15, 30]
    stop_atr_mult: [0.05, 0.10, 0.20]
    relvol_min: [1.0, 2.0, 3.0]
    imbalance_min: [0.0, 0.1, 0.2]
    entry_end: ["15:40", "14:00", "11:00"]
    min_stop_ticks: [3, 5, 8]
